name: {{project_name.snakeCase()}}
description: {{{description}}}
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:

  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^8.0.0
  
  # Navigation
  auto_route: ^10.2.0
  
  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  
  # UI
  google_fonts: ^6.2.1
  
  # Localization
  intl: ^0.19.0
  
  # Local Modules
  gen:
    path: module/gen
  core:
    path: module/core
  common:
    path: module/common
  widgets:
    path: module/widgets

dev_dependencies:
  bloc_lint: ^0.3.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.19
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
  build_runner: ^2.4.12
  auto_route_generator: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
  - assets/env/
  - assets/images/
  - assets/icons/
  - assets/lottie/

  

