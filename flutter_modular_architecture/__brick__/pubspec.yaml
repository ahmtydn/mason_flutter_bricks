name: {{project_name.snakeCase()}}
description: {{{description}}}
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^8.2.0
  
  # Navigation
  auto_route: ^10.2.0
  
  # Network
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  
  # UI
  google_fonts: ^6.3.2
  
  # Localization
  intl: ^0.20.2
  
  # Local Modules
  module_gen:
    path: module/gen
  module_core:
    path: module/core
  module_common:
    path: module/common
  module_widgets:
    path: module/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
  bloc_lint: ^0.3.3
  build_runner: ^2.4.13
  auto_route_generator: ^10.2.5

flutter:
  generate: true
  uses-material-design: true
  assets:
  - assets/env/
  - assets/images/
  - assets/icons/
  - assets/lottie/

  

