name: {{project_name.snakeCase()}}
description: {{{description}}}
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  meta: ^1.18.0
  bloc: ^9.2.0
  
  # Dependency Injection
  get_it: ^8.2.0
  
  # Navigation
  auto_route:
    git:
      url: https://github.com/ahmtydn/auto_route_library.git
      ref: master
      path: auto_route
  
  # Network
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  
  # UI
  google_fonts: ^6.3.2
  
  # Localization
  intl: ^0.20.2
  
  # Local Modules
  module_gen:
    path: module/gen
  module_core:
    path: module/core
  module_common:
    path: module/common
  module_widgets:
    path: module/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
  build_runner: ^2.4.13
  auto_route_generator:
    git:
      url: https://github.com/ahmtydn/auto_route_library.git
      ref: master
      path: auto_route_generator

flutter:
  generate: true
  uses-material-design: true

