name: module_gen
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  flutter:
    sdk: flutter
  envied: ^1.3.1
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  lottie: ^3.3.2
  module_core:
    path: ../core
  isar_plus: ^1.2.1

dev_dependencies:
  build_runner: ^2.4.13
  envied_generator: ^1.3.1
  flutter_gen_runner: ^5.12.0

flutter_gen:
  output: lib/src/asset/
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    outputs:
      package_parameter_enabled: true

flutter:
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/env/

