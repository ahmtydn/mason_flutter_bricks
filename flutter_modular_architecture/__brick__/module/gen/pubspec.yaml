name: module_gen
publish_to: none

environment:
  sdk: ^3.10.7
  flutter: ^3.38.7

dependencies:
  envied: ^1.3.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  isar_plus: ^1.2.1
  lottie: ^3.3.2
  module_core:
    path: ../core


dev_dependencies:
  build_runner: ^2.4.13
  envied_generator: ^1.3.1
  flutter_gen_runner: ^5.12.0

flutter_gen:
  output: lib/src/asset/
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    outputs:
      package_parameter_enabled: true

flutter:
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/env/